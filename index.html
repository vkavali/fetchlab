<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FetchLab - Agent Change Gate for Tool-Using AI</title>
    <meta
      name="description"
      content="FetchLab controls exact AI agent actions and blocks releases that expand authority without review, backed by an integrated API workbench."
    />
    <meta property="og:title" content="FetchLab - Agent Change Gate" />
    <meta
      property="og:description"
      content="Control exact AI agent actions, require one-use approval, and block releases that expand authority without review."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fetchlab.app" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          // Marketing surfaces are always light (brand-led, "cool laboratory").
          // The in-app routes respect localStorage, falling back to system preference.
          var path = (location.pathname || '/').toLowerCase();
          var marketing = path === '/' || path === '' || path === '/pricing' || path === '/download' || path === '/enterprise' || path === '/how-to' || path === '/ai-how-to' || path === '/privacy' || path === '/terms';
          if (marketing) return;
          var saved = localStorage.getItem('fetchlab-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved ? saved === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
